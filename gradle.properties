org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Screenshot tests compare against the references in app/src/test/screenshots; `recordRoborazziDebug` rewrites them.
roborazzi.test.verify=true

# Device tests (baseline profile, startup benchmark) run on the real phone: by default Gradle uninstalls the app
# afterwards, which would wipe Laconic's pins, widgets and settings.
android.injected.androidTest.leaveApksInstalledAfterRun=true
